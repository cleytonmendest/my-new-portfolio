name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, build and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder key: the build takes the Web3Forms path and the e2e test mocks the request,
      # so nothing is sent. The real key only lives in Vercel.
      NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ci-placeholder-key
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
